version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    # Security-only mode: do not open routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - automated
      - security
    commit-message:
      prefix: chore(security-deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Keep Actions quiet unless GitHub surfaces a security update.
    open-pull-requests-limit: 0
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
      - security
    commit-message:
      prefix: chore(security-actions)
