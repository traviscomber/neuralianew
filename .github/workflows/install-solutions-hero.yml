name: Install canonical solutions hero

on:
  push:
    paths:
      - '.github/workflows/install-solutions-hero.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild canonical WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/solutions
          cat .asset-staging/solutions-hero/part-*.b64 | tr -d '\n' | base64 -d > public/images/solutions/hero-system.webp
          test "$(wc -c < public/images/solutions/hero-system.webp)" -eq 66750
          file public/images/solutions/hero-system.webp | grep -q 'Web/P image'

      - name: Commit production asset and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging/solutions-hero
          rm -f .github/workflows/install-solutions-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(solutions): install canonical teal hero asset'
          git push origin HEAD:main

# retry after verified staging
