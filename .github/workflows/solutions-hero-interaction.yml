name: Solutions Hero Interaction

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/solutions-hero-interaction.yml'
      - '.github/scripts/patch-solutions-hero.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero interaction patch
        run: python3 .github/scripts/patch-solutions-hero.py
      - name: Commit patch
        run: |
          rm -f .github/scripts/patch-solutions-hero.py
          rm -f .github/workflows/solutions-hero-interaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(solutions): add hover-reactive cube glow layer"
          git push origin HEAD:main
