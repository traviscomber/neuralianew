name: Materialize Section 04 asset

on:
  push:
    branches:
      - fix/recognition-section04-full-generated-asset
    paths:
      - '.section04-upload/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .section04-upload/part-*.txt > /tmp/section04.b64
          base64 --decode /tmp/section04.b64 > public/platform-system-behind-recognition.webp
          test "$(wc -c < public/platform-system-behind-recognition.webp)" -eq 32772
          echo 'f35ebda99e35d8e7808dbd5e3b6d7dc0fd220991740bd6d18254ef082c1d6383  public/platform-system-behind-recognition.webp' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          p = Path('public/platform-system-behind-recognition.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          print(f'validated {len(b)} bytes')
          PY

      - name: Commit canonical asset and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .section04-upload
          rm -f .github/workflows/materialize-section04.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(recognition): materialize intact Section 04 artwork'
          git push origin HEAD:fix/recognition-section04-full-generated-asset
