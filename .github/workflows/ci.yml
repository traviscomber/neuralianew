name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: High-severity dependency audit
        run: pnpm audit --audit-level high
      - name: Portal contract
        run: node scripts/check-portal-contract.mjs
      - name: Recognition Section 04 asset contract
        run: node scripts/check-recognition-section04-assets.mjs
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm build
