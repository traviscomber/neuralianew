name: Materialize Recognition Section 2 Assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/**'
      - '.github/workflows/materialize-recognition-section2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode verified WebP assets
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .asset-staging/overview.b64 > public/usecase-operations-overview.webp
          base64 -d .asset-staging/urchin.b64 > public/usecase-sea-urchin-clean.webp
          base64 -d .asset-staging/security.b64 > public/usecase-security-clean.webp
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'public/usecase-operations-overview.webp': 12000,
              'public/usecase-sea-urchin-clean.webp': 6000,
              'public/usecase-security-clean.webp': 4500,
          }
          for name, minimum in expected.items():
              data = Path(name).read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{name}: invalid WebP header'
              assert len(data) >= minimum, f'{name}: unexpectedly small ({len(data)} bytes)'
              print(name, len(data), 'bytes OK')
          PY
      - name: Commit decoded binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/usecase-operations-overview.webp public/usecase-sea-urchin-clean.webp public/usecase-security-clean.webp
          if git diff --cached --quiet; then
            echo 'Assets already materialized.'
            exit 0
          fi
          git commit -m 'fix(recognition): materialize verified section 2 WebPs'
          git push origin HEAD:main
