name: Assetin Solutions Hero

on:
  push:
    branches: [main]
    paths:
      - '.assetin/solutions-hero800/**'
      - '.github/workflows/assetin-solutions-hero.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild canonical WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/solutions
          cat \
            .assetin/solutions-hero800/chunk-00 \
            .assetin/solutions-hero800/chunk-01a \
            .assetin/solutions-hero800/chunk-01b \
            .assetin/solutions-hero800/chunk-02 \
            .assetin/solutions-hero800/chunk-03 \
            .assetin/solutions-hero800/chunk-04 \
            > /tmp/hero.b64
          base64 -d /tmp/hero.b64 > public/images/solutions/hero-system.webp
          test "$(sha256sum public/images/solutions/hero-system.webp | awk '{print $1}')" = "740d67bc305a5890656c66f3f2f0c99c72864481aa0dec35e69392ad1405fb13"
          file public/images/solutions/hero-system.webp | grep -qi 'webp'
          rm -rf .assetin
          rm -f .github/workflows/assetin-solutions-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(solutions): install canonical transparent hero asset"
          git push origin HEAD:main
