name: Install Section 02 Assets

on:
  push:
    branches: [section02-assets-v2]
    paths:
      - '.asset-staging/section02-v2/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild canonical Section 02 WebP assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin section02-assets-v2
          mkdir -p public/images/solutions/section02

          rebuild() {
            name="$1"
            expected="$2"
            git ls-tree -r --name-only origin/section02-assets-v2 ".asset-staging/section02-v2/${name}/" \
              | grep '/part-' \
              | sort \
              | while read -r f; do git show "origin/section02-assets-v2:$f"; done \
              | base64 -d > "public/images/solutions/section02/${name}.webp"
            echo "${expected}  public/images/solutions/section02/${name}.webp" | sha256sum -c -
            file "public/images/solutions/section02/${name}.webp"
            ls -lh "public/images/solutions/section02/${name}.webp"
          }

          rebuild visibility a418605c35fdc91bb542791493ad6494943ac83fb4a80fdb06bf8749ac94652d
          rebuild manual-coordination e19b0d5540c7c43f18decdcb69b3bbe2416c0e5a742966d2439d955eccc12cd5
          rebuild slow-response da4eee057c04a7291448a9c9de735535558d9d79dc1c87c96487135fc82b2c31
          rebuild traceability 772cabf0663b3687d06fdc43ad218b6bb9ed3152c6da17029a6e8272ba48c9ec

      - name: Commit canonical Section 02 assets to main
        shell: bash
        run: |
          set -euo pipefail
          git add public/images/solutions/section02
          if git diff --cached --quiet -- public/images/solutions/section02; then
            echo "Canonical Section 02 assets are already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(solutions): install canonical section 02 card assets"
          git push origin main
