name: Materialize Recognition Assets

on:
  push:
    branches: [main]
    paths:
      - 'assets-source/recognition-release/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct verified WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cat assets-source/recognition-release/part-*.b64 > /tmp/recognition-assets.b64
          base64 --decode /tmp/recognition-assets.b64 > /tmp/recognition-assets.tar
          echo '3afb1748636e7724acf37c64db68e23f9d1074d1c60fb7e8702d87122acdb10a  /tmp/recognition-assets.tar' | sha256sum -c -
          tar -xf /tmp/recognition-assets.tar -C public

          declare -A expected=(
            [hero-command-center-cougar.webp]=f171b473e23238ccbdb2134bf6c0022086ee5f15
            [usecase-cougar-clean.webp]=32317f5bffdf3390a331b06ea29744a72b2e3588
            [usecase-cow-clean.webp]=a3df041e61d28ebbe094ac9dbeeee4bf00c40019
            [usecase-sea-urchin-clean.webp]=f1dd88426375816e0ee01d04631dd43020d2a577
            [usecase-security-clean.webp]=74baa433134bb7df8189b8cf072afb6fdd17ab40
            [value-chain-detection-action.webp]=57b593b13697205181f1c0c409ad18bbba47cdd4
            [platform-system-behind-recognition.webp]=791b55dd77231954fa11c80f389f1e969d8116ea
            [command-center-scale.webp]=6ab088a21f81ac86fef14d73bd2082b6fbec9b90
          )

          for name in "${!expected[@]}"; do
            test -s "public/$name"
            file "public/$name" | grep -q 'Web/P image'
            actual="$(git hash-object "public/$name")"
            test "$actual" = "${expected[$name]}" || { echo "SHA mismatch for $name: $actual"; exit 1; }
          done

      - name: Commit production assets and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets-source/recognition-release assets-source/recognition-hero
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public assets-source
          git commit -m 'feat(recognition): materialize verified production WebP assets'
          git push origin HEAD:main
