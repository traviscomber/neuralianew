name: Materialize recognition assets

on:
  push:
    branches: [main]
    paths:
      - 'recognition-upload/*.ready'
      - '.github/workflows/materialize-recognition-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ready_files=(recognition-upload/*.ready)
          if [ ${#ready_files[@]} -eq 0 ]; then
            echo 'No ready assets.'
            exit 0
          fi
          mkdir -p public
          for ready in "${ready_files[@]}"; do
            name="$(basename "$ready" .ready)"
            chunks=(recognition-upload/"$name".b64.*)
            if [ ${#chunks[@]} -eq 0 ]; then
              echo "No chunks for $name" >&2
              exit 1
            fi
            python3 - "$name" "${chunks[@]}" <<'PY'
          import base64, pathlib, re, sys
          name = sys.argv[1]
          chunks = [pathlib.Path(p) for p in sys.argv[2:]]
          raw = b''.join(p.read_bytes() for p in chunks)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)
          pathlib.Path('public', name).write_bytes(data)
          PY
            bytes="$(wc -c < "public/$name")"
            if [ "$bytes" -lt 4096 ]; then
              echo "Asset too small: $name ($bytes bytes)" >&2
              exit 1
            fi
            file "public/$name" | grep -qi 'Web/P\|WebP' || { echo "Not WebP: $name" >&2; exit 1; }
            git add "public/$name"
            git rm -f "${chunks[@]}" "$ready"
            actual="$(git hash-object "public/$name")"
            echo "verified $name ($bytes bytes, $actual)"
          done
      - name: Commit binaries
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(recognition): materialize production WebP assets'
          git push origin HEAD:main
