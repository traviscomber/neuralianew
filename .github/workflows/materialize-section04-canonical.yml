name: Materialize canonical Recognition Section 04 artwork

on:
  push:
    branches:
      - chore/recognition-section04-canonical-workflow
    paths:
      - '.github/workflows/materialize-section04-canonical.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate canonical WebP
        shell: bash
        run: |
          set -euo pipefail
          chunks=(recognition-upload/recognition-section04-platform-v7.webp.b64.*)
          if [ ${#chunks[@]} -ne 4 ]; then
            echo "Expected 4 Section 04 chunks, found ${#chunks[@]}" >&2
            exit 1
          fi
          python3 - "${chunks[@]}" <<'PY'
          import base64
          import pathlib
          import re
          import sys

          chunks = [pathlib.Path(path) for path in sys.argv[1:]]
          raw = b''.join(path.read_bytes() for path in chunks)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)

          target = pathlib.Path('public/platform-system-behind-recognition.webp')
          target.write_bytes(data)

          if len(data) < 4096:
              raise SystemExit(f'Asset too small: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded asset is not a valid WebP container')

          print(f'validated {target} ({len(data)} bytes)')
          PY
      - name: Commit canonical asset and remove one-time staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/platform-system-behind-recognition.webp
          git rm recognition-upload/recognition-section04-platform-v7.webp.b64.*
          git rm .github/workflows/materialize-section04-canonical.yml
          git commit -m 'chore(recognition): materialize canonical section 04 artwork'
          git push origin HEAD:${GITHUB_REF_NAME}
