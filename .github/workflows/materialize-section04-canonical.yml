name: Materialize canonical Recognition Section 04 artwork

on:
  push:
    branches:
      - chore/recognition-section04-canonical-workflow
    paths:
      - '.github/workflows/materialize-section04-canonical.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and validate current production WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import pathlib
          import re

          source = pathlib.Path('components/recognition-assets/section-4.ts').read_text()
          match = re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', source)
          if not match:
              raise SystemExit('No embedded Section 04 WebP found')

          data = base64.b64decode(match.group(1), validate=True)
          target = pathlib.Path('public/platform-system-behind-recognition.webp')
          target.write_bytes(data)

          if len(data) < 4096:
              raise SystemExit(f'Asset too small: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded asset is not a valid WebP container')

          print(f'validated {target} ({len(data)} bytes)')
          PY
      - name: Commit canonical asset and remove invalid one-time staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/platform-system-behind-recognition.webp
          git rm recognition-upload/recognition-section04-platform-v7.webp.b64.*
          git rm .github/workflows/materialize-section04-canonical.yml
          git commit -m 'chore(recognition): materialize canonical section 04 artwork'
          git push origin HEAD:${GITHUB_REF_NAME}
