name: Materialize Clar1ty product screenshot

on:
  push:
    branches: [main]
    paths:
      - 'public/n3uralia-retro/product-clarity-showcase.webp.b64'
      - '.github/workflows/materialize-clarity-product.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode exact supplied screenshot
        shell: bash
        run: |
          set -euo pipefail
          SRC='public/n3uralia-retro/product-clarity-showcase.webp.b64'
          OUT='public/n3uralia-retro/product-clarity-showcase.webp'
          if [ ! -f "$SRC" ]; then
            echo 'Payload already materialized.'
            exit 0
          fi
          base64 --decode "$SRC" > "$OUT"
          test -s "$OUT"
          file "$OUT"
      - name: Commit materialized asset
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f public/n3uralia-retro/product-clarity-showcase.webp.b64 ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/n3uralia-retro/product-clarity-showcase.webp
          git commit -m 'fix(products): materialize exact Clar1ty screenshot' || exit 0
          git push origin HEAD:main
