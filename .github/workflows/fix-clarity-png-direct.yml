name: Fix Clar1ty direct PNG

on:
  push:
    branches: [main]
    paths:
      - '.clarity-png-direct-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize canonical Clar1ty PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('public/n3uralia-retro/product-clarity-showcase.webp')
          dst = Path('public/n3uralia-retro/product-clarity.png')
          with Image.open(src) as im:
              im.convert('RGB').save(dst, format='PNG', optimize=True)
          print('wrote', dst)
          PY

      - name: Restore canonical product image path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/retro-catalog-pages.tsx')
          s = p.read_text()
          s = s.replace("img: '/n3uralia-retro/product-clarity-showcase.webp'", "img: '/n3uralia-retro/product-clarity.png'")
          p.write_text(s)
          PY

      - name: Remove Clar1ty conversion workarounds
        run: |
          rm -f public/n3uralia-retro/product-clarity-showcase.webp
          rm -f public/n3uralia-retro/product-clarity-showcase.webp.b64
          rm -f public/n3uralia-retro/product-clarity-showcase-fixed.marker
          rm -f public/n3uralia-retro/product-clarity-portal.svg
          rm -f .github/workflows/materialize-clarity-product.yml
          rm -f .clarity-png-direct-trigger
          rm -f .github/workflows/fix-clarity-png-direct.yml

      - name: Commit canonical direct PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(products): use direct Clar1ty PNG asset like Parrotfy'
          git push origin main
