name: Install canonical Clar1ty PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-clarity-canonical-png.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify canonical PNG
        shell: bash
        run: |
          set -euo pipefail
          cat .clarity-upload/00 .clarity-upload/01 .clarity-upload/02 .clarity-upload/03 .clarity-upload/04 .clarity-upload/05 > /tmp/clarity.b64
          echo '1bfe9d494a3f36296d4b6c41e8a9df5ff309e87d3991f0639bdf49153d2a51bb  /tmp/clarity.b64' | sha256sum -c -
          base64 --decode /tmp/clarity.b64 > public/n3uralia-retro/product-clarity.png
          echo '26076e2379fdf72b3c4b5291c77fc18d65b5a31b1742035d9a0d00121eea6b49  public/n3uralia-retro/product-clarity.png' | sha256sum -c -
          file public/n3uralia-retro/product-clarity.png

      - name: Point Clar1ty product to canonical PNG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('components/retro-catalog-pages.tsx')
          text = path.read_text()
          old = "img: '/n3uralia-retro/product-clarity-showcase.webp'"
          new = "img: '/n3uralia-retro/product-clarity.png'"
          if old not in text and new not in text:
              raise SystemExit('Clar1ty product image reference not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Remove obsolete Clar1ty asset workarounds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .clarity-upload .clarity-stage
          rm -f .clarity-png-direct-trigger
          rm -f public/n3uralia-retro/product-clarity-showcase.webp
          rm -f public/n3uralia-retro/product-clarity-showcase.webp.b64
          rm -f public/n3uralia-retro/product-clarity-showcase-fixed.marker
          rm -f public/n3uralia-retro/product-clarity-portal.svg
          rm -f public/n3uralia-retro/product-clarity.png.b64
          rm -f public/n3uralia-retro/product-clarity-canonical.png.b64
          rm -f .github/workflows/materialize-clarity-product.yml
          rm -f .github/workflows/fix-clarity-png-direct.yml
          rm -f .github/workflows/install-clarity-canonical-png.yml

      - name: Commit and push canonical asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(products): install canonical Clar1ty PNG asset'
          git push origin main
